<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Visualizador de PDF</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; }
      body {
        display: flex;
        flex-direction: column;
        overflow: hidden;
        background: #e8edf5;
        color: #172554;
        font-family: Arial, sans-serif;
      }
      .toolbar {
        display: flex;
        min-height: 52px;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 8px 12px;
        background: #172554;
        color: #fff;
      }
      .toolbar button {
        min-width: 38px;
        min-height: 34px;
        border: 0;
        border-radius: 6px;
        background: #334b80;
        color: #fff;
        font-size: 17px;
        cursor: pointer;
      }
      .toolbar button:disabled { opacity: .45; cursor: default; }
      .toolbar input {
        width: 50px;
        height: 32px;
        border: 0;
        border-radius: 5px;
        text-align: center;
      }
      #zoom-label { min-width: 44px; text-align: center; font-size: 13px; }
      #message {
        margin: auto;
        padding: 24px;
        color: #475569;
        text-align: center;
        line-height: 1.5;
      }
      #pages {
        flex: 1;
        overflow: auto;
        padding: 16px;
        text-align: center;
      }
      #page-canvas {
        display: block;
        max-width: 100%;
        height: auto;
        margin: 0 auto;
        background: #fff;
        box-shadow: 0 2px 12px rgb(15 23 42 / 20%);
      }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <nav class="toolbar" aria-label="Controles do PDF" hidden>
      <button id="previous" type="button" aria-label="Página anterior">‹</button>
      <input id="page-number" type="number" min="1" value="1" aria-label="Página atual" />
      <span>/ <span id="page-count">0</span></span>
      <button id="next" type="button" aria-label="Próxima página">›</button>
      <button id="zoom-out" type="button" aria-label="Diminuir zoom">−</button>
      <span id="zoom-label">100%</span>
      <button id="zoom-in" type="button" aria-label="Aumentar zoom">+</button>
    </nav>
    <p id="message" role="status">Carregando documento...</p>
    <main id="pages" hidden>
      <canvas id="page-canvas"></canvas>
    </main>
    <script type="module">
      import * as pdfjsLib from "/pdfjs/pdf.mjs";

      const message = document.querySelector("#message");
      const toolbar = document.querySelector(".toolbar");
      const pages = document.querySelector("#pages");
      const canvas = document.querySelector("#page-canvas");
      const pageNumber = document.querySelector("#page-number");
      const pageCount = document.querySelector("#page-count");
      const zoomLabel = document.querySelector("#zoom-label");
      const previousButton = document.querySelector("#previous");
      const nextButton = document.querySelector("#next");
      let pdf;
      let currentPage = 1;
      let zoom = 1;
      let renderTask;

      pdfjsLib.GlobalWorkerOptions.workerSrc = "/pdfjs/pdf.worker.mjs";

      function updateControls() {
        pageNumber.value = String(currentPage);
        pageNumber.max = String(pdf.numPages);
        pageCount.textContent = String(pdf.numPages);
        zoomLabel.textContent = `${Math.round(zoom * 100)}%`;
        previousButton.disabled = currentPage <= 1;
        nextButton.disabled = currentPage >= pdf.numPages;
      }

      async function renderPage() {
        if (renderTask) {
          const previousRender = renderTask;
          previousRender.cancel();
          renderTask = null;
          try {
            await previousRender.promise;
          } catch (error) {
            if (error.name !== "RenderingCancelledException") throw error;
          }
        }

        const page = await pdf.getPage(currentPage);
        const baseViewport = page.getViewport({ scale: 1 });
        const fitScale = Math.min(
          (pages.clientWidth - 32) / baseViewport.width,
          (pages.clientHeight - 32) / baseViewport.height,
        );
        const scale = Math.max(0.25, fitScale * zoom);
        const viewport = page.getViewport({ scale });
        const outputScale = Math.min(window.devicePixelRatio || 1, 2);
        const context = canvas.getContext("2d");
        canvas.width = Math.floor(viewport.width * outputScale);
        canvas.height = Math.floor(viewport.height * outputScale);
        canvas.style.width = `${viewport.width}px`;
        canvas.style.height = `${viewport.height}px`;
        renderTask = page.render({
          canvasContext: context,
          viewport,
          transform: outputScale === 1 ? null : [outputScale, 0, 0, outputScale, 0, 0],
        });
        await renderTask.promise;
        renderTask = null;
        pages.scrollTop = 0;
        updateControls();
      }

      function setPage(value) {
        currentPage = Math.max(1, Math.min(pdf.numPages, Number(value) || 1));
        renderPage().catch(showError);
      }

      function showError(error) {
        message.hidden = false;
        message.textContent =
          error?.message || "Não foi possível carregar este PDF.";
        toolbar.hidden = true;
        pages.hidden = true;
      }

      previousButton.addEventListener("click", () => setPage(currentPage - 1));
      nextButton.addEventListener("click", () => setPage(currentPage + 1));
      pageNumber.addEventListener("change", () => setPage(pageNumber.value));
      document.querySelector("#zoom-out").addEventListener("click", () => {
        zoom = Math.max(0.5, zoom - 0.2);
        renderPage().catch(showError);
      });
      document.querySelector("#zoom-in").addEventListener("click", () => {
        zoom = Math.min(3, zoom + 0.2);
        renderPage().catch(showError);
      });
      window.addEventListener("resize", () => renderPage().catch(showError));

      try {
        const sourcePath = new URLSearchParams(location.search).get("path");
        if (!sourcePath) throw new Error("Nenhum arquivo PDF foi selecionado.");
        const documentTask = pdfjsLib.getDocument({
          url: `/pdf?path=${encodeURIComponent(sourcePath)}`,
          isEvalSupported: false,
        });
        pdf = await documentTask.promise;
        message.hidden = true;
        toolbar.hidden = false;
        pages.hidden = false;
        updateControls();
        await renderPage();
      } catch (error) {
        showError(error);
      }
    </script>
  </body>
</html>
